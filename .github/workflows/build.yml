name: Build ServerAssistant

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install config validator
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate config YAML
        run: python validate_config.py

      # Read the Maven coordinates once. pom.xml is the single source of truth
      # for the plugin version and artifact name.
      - name: Read project metadata
        id: project
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pom = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          artifact_id = pom.findtext("m:artifactId", namespaces=ns)
          version = pom.findtext("m:version", namespaces=ns)
          if not artifact_id or not version:
              raise SystemExit("Could not read artifactId/version from pom.xml")

          artifact_id = artifact_id.strip()
          version = version.strip()
          jar = f"target/{artifact_id}-{version}.jar"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"artifact_id={artifact_id}\n")
              out.write(f"version={version}\n")
              out.write(f"jar={jar}\n")

          print(f"Artifact: {artifact_id}")
          print(f"Version:  {version}")
          print(f"JAR:      {jar}")
          PY

      - name: Build with Maven
        run: mvn -B --no-transfer-progress clean package

      - name: Verify plugin jar
        shell: bash
        run: |
          test -f "${{ steps.project.outputs.jar }}"
          ls -lh "${{ steps.project.outputs.jar }}"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.project.outputs.artifact_id }}-${{ steps.project.outputs.version }}
          path: ${{ steps.project.outputs.jar }}
          if-no-files-found: error
