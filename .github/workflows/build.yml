name: Build ServerAssistant

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate config YAML
        run: python validate_config.py

      - name: Build with Maven
        run: mvn -B --no-transfer-progress clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ServerAssistant-1.3.0
          path: target/ServerAssistant-1.3.0.jar
          if-no-files-found: error
