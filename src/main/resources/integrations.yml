# ============================================================
# SERVER ASSISTANT - OPTIONAL INTEGRATIONS
# Read-only external plugin context. No integration creates extra AI requests.
# Missing keys are auto-added on updates while your values are preserved.
# ============================================================

config-version: 2

# Master switch for every external integration.
enabled: true

# One bounded profile context block can merge multiple integrations while counting
# as a single local CONTEXT tool.
profile-context:
  enabled: true
  max-players: 2


# ============================================================
# AMBIENT PLAYER IDENTITY
# Injected automatically for players involved in a model scene. This is trusted
# local context, costs no extra AI request and does not consume a CONTEXT-tool slot.
# It lets the personality react naturally to a player's race/title/level even when
# nobody explicitly asks for a profile.
# ============================================================
identity-context:
  enabled: true
  include-race: true
  include-level: true
  include-title: true
  # Safety bound only for pathological scenes that mention many online players.
  # Normal MDVCRAFT scenes are far below this value.
  max-players: 12

# ============================================================
# MMOCORE
# In MDVCRAFT, MMOCore classes are used as player races.
# ServerAssistant first tries MMOCore's API via reflection and can fall back to
# PlaceholderAPI when available. There is no hard compile/runtime dependency.
# ============================================================
mmocore:
  enabled: true
  class-as-race: true
  placeholder-fallback: true

  basic:
    race: true
    race-id: false
    level: true
    experience: false

  # ids: [] = auto-discover configured MMOCore professions, bounded by max.
  professions:
    enabled: true
    max: 8
    ids: []

  # ids: [] = use the player's configured MMOCore attributes, bounded by max.
  attributes:
    enabled: true
    max: 8
    ids: []

  # Stats can be numerous, so they are only included when the scene asks for stats
  # unless include-on-general is enabled. ids: [] auto-discovers MMOCore/stats.yml.
  stats:
    enabled: true
    include-on-general: false
    auto-discover: true
    max: 8
    ids: []

  resources:
    enabled: true
    include-on-general: false
    mana: true
    stamina: true
    stellium: false

  points:
    enabled: true
    include-on-general: false
    skill-points: true
    class-points: true
    attribute-points: true

# ============================================================
# MDVSOCIAL
# Uses MDVSocialAPI when available, with PlaceholderAPI as an optional fallback.
# ============================================================
mdvsocial:
  enabled: true
  placeholder-fallback: true

  title:
    include-display: true
    include-id: false
    include-unlocked-count: false
