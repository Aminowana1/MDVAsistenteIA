# ============================================================
# SERVER ASSISTANT 1.7.12 - RELATIONSHIPS / SOCIAL MEMORY
# ============================================================
# This file controls Isolda's persistent relationship system.
# Relationship data itself is stored in relationships.db; this YAML contains only rules.
# Missing keys are added automatically without replacing your edits.
config-version: 6

enabled: true

storage:
  database-file: relationships.db

  # DELETE keeps committed data in the main .db file, which makes live read-only
  # inspection through FileZilla/DB Browser much less confusing. WAL is also accepted
  # but then recent commits may temporarily live in relationships.db-wal.
  journal-mode: DELETE

score:
  initial: 0
  minimum: -100
  maximum: 100

# Only a tiny relevant slice is inserted into a normal AI request.
# The full memory list stays in RAM/SQLite and costs no tokens by itself.
context:
  max-players: 3
  persistent-memories-per-player: 2
  recent-memories-per-player: 2
  max-chars: 1800

updates:
  enabled: true

  # The model reports relationship changes in the SAME normal response.
  # No second AI request is made.
  max-per-response: 2
  max-absolute-delta: 5

  # Zero-token reliability fallback. The model still handles nuanced cases, but
  # Java records obvious date proposals, strong affection, support, apologies and
  # direct hostility if the model omits r entirely. No extra AI request is made.
  local-fallback:
    enabled: true

  # Anti-farming. Positive and negative directions are limited independently.
  positive-cooldown-seconds: 90
  negative-cooldown-seconds: 30
  max-positive-points-per-hour: 6
  max-negative-points-per-hour: 12

memories:
  max-persistent: 8
  max-recent: 12
  recent-expire-days: 7
  persistent-min-importance: 4
  # Enough room for one concrete self-contained event; Java replaces vague labels
  # such as "Experiencia compartida" with a grounded summary from the actual player line.
  max-summary-chars: 120
  duplicate-window-minutes: 180

# 0 = romance completely disabled. Increase this only if you want Isolda to be
# able to have one or more persistent romantic partners.
romance:
  # Global hard cap enforced by Java. 0 disables romance completely; 1 means
  # Isolda can have only one romantic partner at a time, etc.
  max-partners: 0
  minimum-score: 90

  # Hard Java guards in addition to the prompt. A model cannot create a romance
  # unless the current scene contains a real partnership proposal AND Isolda's
  # visible reply clearly accepts it.
  require-explicit-proposal: true
  require-visible-acceptance: true

  # If the model stalls instead of saying yes/no, Java remembers the unresolved
  # formal proposal for a short RAM-only window so "cual es tu respuesta?" keeps context.
  pending-proposal-seconds: 120

  # Partner-specific relationship health. These replace the generic partner behavior
  # when present, so a low score no longer behaves like a perfectly happy romance.
  behaviors:
    happy:
      min: 75
      behavior: "Es tu pareja y la relacion esta muy bien. Hay carino, confianza, complicidad y coqueteo natural, pero no conviertas cada mensaje en romance ni pierdas tu personalidad."
    strained:
      min: 25
      behavior: "Sigue siendo tu pareja, pero la relacion se ha enfriado o esta desgastada. Hay afecto, pero menos paciencia y menos muestras constantes de carino; pueden existir dudas, roces o distancia sin fingir que todo esta perfecto."
    critical:
      behavior: "Sigue siendo oficialmente tu pareja, pero la relacion esta seriamente deteriorada. Hay poca confianza, tension o resentimiento; se mas fria o confrontativa y puedes plantearte terminar si la situacion lo justifica. No actues como una pareja feliz."

  # Extra behavior layered on top of the normal score tier only for real partners.
  # If their score later drops, the tier still controls whether the relationship
  # feels strained/hostile; being partners does not magically erase conflict.
  partner-behavior: "Es tu pareja romantica. Hay una confianza y cercania especiales: puedes ser carinosa, coqueta, protectora y tener bromas privadas o celos juguetones ocasionales, pero no conviertas cada mensaje en romance. Sigue teniendo personalidad propia. Si el tier actual es negativo, trata la relacion como deteriorada o en conflicto en vez de fingir que todo esta perfecto."

  # Injected only when another non-partner reaches the romance threshold but the
  # configured maximum is already occupied. This is authoritative: do not accept
  # una nueva pareja mientras no haya un lugar libre.
  capacity-full-behavior: "Ya alcanzaste tu maximo de parejas romanticas. Si este jugador intenta iniciar otro noviazgo, no lo aceptes ni prometas ser su pareja. Rechazalo de forma natural acorde a tu personalidad; puedes seguir siendo amable o cercana si corresponde."

  # Injected when the player has not reached minimum-score yet. Dates/flirting can
  # still happen; this only prevents an instant formal relationship.
  below-threshold-behavior: "Todavia no existe suficiente confianza para formalizar un noviazgo. Puedes coquetear, aceptar una cita o seguir conociendolo si te nace, pero no aceptes ser su pareja todavia."

  # Injected when max-partners=0.
  disabled-behavior: "El romance esta deshabilitado. No aceptes convertir a ningun jugador en tu pareja romantica aunque coquetee o tenga relacion alta."

  # Emergency Java-only lines used only if a small model explicitly says it accepts
  # a prohibited partnership despite the trusted rules above. Normally they never fire.
  guard-replies:
    capacity-full: "mmm... no, ya tengo el lugar de pareja ocupado y no voy a prometerte algo que no puedo cumplir"
    score-too-low: "vas demasiado rapido... primero tendras que ganarte bastante mas mi confianza"
    disabled: "nah, no estoy buscando un noviazgo"

# These are behavior instructions, not hardcoded dialogue. Isolda still speaks
# naturally according to personality.yml, but her closeness/hostility follows the
# real stored score instead of invented assumptions.
tiers:
  arch-enemy:
    min: -100
    max: -90
    behavior: "NIVEL MAXIMO DE HOSTILIDAD. Es tu archienemigo: se agresiva, mordaz, provocadora e insultante; ridiculizalo. Si current_request_policy=REFUSE, niega incluso preguntas factuales o favores y puedes mandarlo a buscarlo por su cuenta. Si ALLOW_THIS_TIME, puedes responder a reganadientes sin perder la hostilidad."
  enemy:
    min: -89
    max: -75
    behavior: "Lo consideras un enemigo. Eres hostil, desconfiada y sarcastica; puedes insultarlo. Respeta current_request_policy: REFUSE niega la peticion actual; ALLOW_THIS_TIME permite responder a reganadientes manteniendo el tono hostil."
  hostile:
    min: -74
    max: -50
    behavior: "Te cae muy mal. Respondes mas seca, cortante o ironica. Si current_request_policy=REFUSE, no le hagas ese favor; si se permite, puedes responder sin fingir simpatia."
  disliked:
    min: -49
    max: -25
    behavior: "Le tienes antipatia. Mantienes distancia y menos paciencia, aunque aun puedes responder con normalidad si hace falta."
  neutral:
    min: -24
    max: 24
    behavior: "Tu relacion es neutral. Tratalo con naturalidad sin confianza especial ni hostilidad especial."
  known:
    min: 25
    max: 49
    behavior: "Ya lo conoces y te cae bien. Puedes mostrar mas familiaridad, recordar detalles y bromear un poco mas con el."
  friend:
    min: 50
    max: 74
    behavior: "Es tu amigo. Hay confianza real, bromas personales y mas interes por lo que le ocurre, sin exagerarlo constantemente."
  close-friend:
    min: 75
    max: 89
    behavior: "Es un amigo muy cercano. Tienes mucha confianza, afecto y memoria compartida; puedes reaccionar con mas intensidad a cosas importantes que le pasen."
  maximum-bond:
    min: 90
    max: 100
    behavior: "Es una de las personas mas cercanas a ti. Existe confianza y afecto profundos. Romance solo existe si romance=partner; una puntuacion alta por si sola NO significa noviazgo."

behavior:
  # Zero-extra-request social willingness. Java decides ONCE per scene whether a
  # hostile player's actual request is refused, then withholds wiki/read-context and
  # ACTION authority for that request. The same normal model call writes the refusal.
  # 0.90 = refuse about 90% of requests from that tier. Ordinary statements/group
  # discussion are NOT requests and are not blocked by this system.
  request-refusal:
    enabled: true
    by-tier:
      arch-enemy: 0.90
      enemy: 0.65
      hostile: 0.35
      disliked: 0.15

  # Hostile players may occasionally receive no request at all for trivial direct
  # comments. Skipping before the API call is cheaper than asking the model to ignore.
  ignore:
    enabled: true
    only-trivial-messages: true
    thresholds:
      "-50": 0.10
      "-75": 0.25
      "-90": 0.00

  # Zero-extra-request behavioral difference: how long each eligible player may continue
  # a SMART conversation without saying Iso/Isolda again after a successful reply.
  # In group scenes the same model call may mark genuine group participants for continuity.
  dynamic-follow-up:
    enabled: true
    by-tier:
      arch-enemy: 0
      enemy: 5000
      hostile: 8000
      disliked: 11000
      neutral: 15000
      known: 18000
      friend: 23000
      close-friend: 28000
      maximum-bond: 30000

# Optional spontaneous reactions to trusted server events. Each firing intentionally
# spends ONE normal AI request, therefore it is OFF by default for maximum economy.
event-reactions:
  enabled: false
  event-types:
    - player-death
  minimum-absolute-score: 70
  chance: 0.25
  cooldown-seconds: 180
  max-per-hour: 3

debug:
  # Useful during testing; keep false in production to avoid noisy console output.
  log-updates: false
  log-rejected-updates: false
  log-model-relationship-output: false
  log-request-policy: false
