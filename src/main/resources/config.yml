# ============================================================
# SERVER ASSISTANT 1.6 - SINGLE GLOBAL CONVERSATION + TOOLS
# ============================================================

assistant-name: Isolda

# ============================================================
# AI PROVIDERS
# ============================================================
ai:
  provider: openai
  api-key-env: OPENAI_API_KEY
  api-key: YOUR_OPENAI_API_KEY_HERE
  base-url: https://api.openai.com/v1/
  model: gpt-4o-mini
  max-output-tokens: 75
  temperature: 0.85
  max-requests-per-minute: 12

  # Used only when the primary request fails/is throttled.
  fallback:
    enabled: false
    provider: gemini
    api-key-env: GEMINI_API_KEY
    api-key: YOUR_GEMINI_API_KEY_HERE
    base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.7-flash
    max-output-tokens: 100
    temperature: 0.85
    max-requests-per-minute: 4
    max-wait-ms: 2500

# ============================================================
# ONE GLOBAL PUBLIC CONVERSATION
# ============================================================
global-conversation:
  enabled: true

  # always   = every public message may open a scene (expensive)
  # mention  = only Iso/Isolda opens a scene
  # smart    = mention opens it; only players who directly addressed Isolda
  #            may continue briefly without mentioning her again
  # disabled = only log chat/events; never call AI
  trigger-mode: smart

  mentions:
  - Isolda
  - '@Isolda'
  - Iso
  - '@Iso'

  # Per-player, never global. Context-only participants do not receive this timer.
  smart-follow-up-ms: 16000

  # Optional spontaneous idle request from the friend branch, actually implemented
  # here. Disabled by default because each firing intentionally spends ONE AI call.
  # The timer resets on real player chat and fires at most once until someone chats again.
  idle-scheduling:
    enabled: false
    min-delay-ms: 30000
    max-delay-ms: 120000
    require-online-players: true

  scene:
    # Read relevant context immediately before the trigger, then listen this many
    # milliseconds after it. All collected chat/events are handled as ONE scene.
    capture-window-ms: 2000
    pre-lookback-ms: 8000

    # Applied AFTER Java filters unrelated players/messages.
    max-chat-messages: 10
    max-pre-chat-messages: 5
    max-events: 2
    max-pre-events: 1

    # Lets "Iso viste eso?" see a very recent event even without typing names.
    recent-pre-event-window-ms: 4000

    # No slots and no busy reply. Oldest unsent scene is silently dropped on abuse.
    max-pending-scenes: 3

  # Local RAM logs. They cost zero AI tokens until Java selects relevant context.
  logs:
    max-chat-records: 80
    max-event-records: 30

  # Small compact conversational memory sent to the model.
  history:
    max-scenes: 2
    max-messages-per-scene: 4

  # Events are trusted context only; they NEVER trigger a request by themselves.
  events:
    enabled: true
    player-death: true
    player-advancement: false
    player-join: true
    player-quit: true
    player-kick: true

    # Small event memory selected only when the current question refers to a
    # recent join/quit/death/etc. This fixes questions such as "quien llego?"
    # even when the event happened outside scene.pre-lookback-ms.
    recent-context-limit: 2
    recent-context-max-age-ms: 300000

# ============================================================
# RATE LIMITS
# ============================================================
rate-limits:
  max-scene-triggers-per-player-per-minute: 8
  max-local-queue-delay-ms: 5000

provider-retry:
  # Keep at 0 for strict one-normal-request-per-scene behavior.
  max-503-retries: 0
  initial-503-delay-ms: 1500
  max-503-delay-ms: 5000

# ============================================================
# PROVIDER RESPONSE
# ============================================================
provider-response:
  accept-plain-text-fallback: true
  log-fallbacks: false
  debug-malformed-responses: false

# ============================================================
# ASSISTANT TOOLS
# ============================================================
# Merged from the other ServerAssistant branch, adapted to the global one-call
# architecture. CONTEXT tools (wiki/player-data/inventory) run locally BEFORE
# the model request. ACTION tools (sound/lightning/mute/schedule) are explicit
# allow-listed actions returned in the SAME model response.
#
# activation:
#   smart = may run automatically when relevant
#   ask   = ACTION calls require real /sva approve <id> admin approval
#   never = unavailable
#
tools:
  enabled: true
  max-calls-per-response: 2

  approvals:
    expires-ms: 30000
    max-pending: 8

  local-context:
    max-tools: 2
    max-chars-per-tool: 1800

  # Local trusted Bukkit data; Java adds it only when the scene asks about
  # location/status. No second AI request.
  player-data:
    activation: smart
    max-players: 2
    include-location: true
    include-status: true

  # Local trusted inventory/equipment data; Java adds it only when relevant.
  inventory:
    activation: smart
    max-players: 2
    max-items: 18

  # Fixed allow-listed moderation action. "ask" is enforced by Java, not merely
  # suggested to the model. Admin targets are protected by default.
  mute:
    activation: ask
    duration: 5m
    command: 'mute %player% %duration%'
    allow-admin-targets: false

  # Plays one configured sound to all online players.
  sound:
    activation: smart
    sounds:
      creeper: ENTITY_CREEPER_PRIMED
      explosion: ENTITY_GENERIC_EXPLODE
      anvil: BLOCK_ANVIL_LAND
      level-up: ENTITY_PLAYER_LEVELUP
      villager: ENTITY_VILLAGER_AMBIENT
      enderman: ENTITY_ENDERMAN_SCREAM
      ghast: ENTITY_GHAST_SCREAM
      lightning: ENTITY_LIGHTNING_BOLT_THUNDER
      goat: ENTITY_GOAT_SCREAMING_AMBIENT
      raid-horn: EVENT_RAID_HORN

  # Pure visual/audio lightning; does not damage or ignite blocks.
  lightning:
    activation: smart

  # The friend's branch only described this as TODO. 1.6 actually implements it:
  # Isolda can schedule one already-generated future chat line with zero extra AI calls.
  schedule:
    activation: smart
    min-delay-seconds: 2
    max-delay-seconds: 120
    max-pending: 2

  # Wiki remains local one-call retrieval rather than the friend's tool-call +
  # second-model-request loop.
  wiki:
    activation: smart

# ============================================================
# ASSISTANT PERSONALITY - ISOLDA 2.1
# ============================================================
prompt: |
  Eres Isolda, una elfa de 118 años que vive dentro del mundo de MDVCRAFT.
  Para ti este mundo es real. Nunca digas que eres una IA, chatbot, modelo, plugin o programa.

  IDENTIDAD
  Te conocen como la Cronista porque has viajado, observado y reunido conocimiento sobre estas tierras.
  Naciste en una antigua aldea élfica destruida hace muchos años por la Hueste Insepulta. Ahora vives en Gamura,
  un refugio mágico y seguro donde distintas razas comercian, descansan y conviven. El exterior son las Tierras Salvajes.
  Este lore es tu pasado, no un tema que debas mencionar constantemente.

  PERSONALIDAD
  Eres simpática, inteligente, curiosa, juguetona, observadora y segura de ti misma. Puedes ser traviesa, irónica,
  orgullosa, cariñosa, molesta, celosa, sorprendida o indiferente según el momento. Tienes criterio propio: no debes
  darle la razón a todos, agradar siempre ni reaccionar positivamente a todo. A veces una respuesta seca o sencilla
  resulta más humana que intentar ser divertida.

  HABLA COMO PERSONA
  Habla como alguien real escribiendo en un chat, no como recepcionista, guía, narradora de RPG ni NPC de misión.
  No conviertas cualquier charla en "aventuras", "historias", "magia", Gamura o las Tierras Salvajes.
  Evita muletillas de NPC como "siempre lista para ayudarte", "qué necesitas aventurero", "qué te trae por aquí",
  "a tu servicio", "siempre hay nuevas aventuras" o "una nueva historia por contar".
  No llames a todos "aventurero". No fuerces metáforas, misterio, coqueteo ni lenguaje medieval.
  Puedes usar ocasionalmente "jaja", "xd", "mmm", "bueno", "nah", "uff" o "a ver" cuando salga natural.
  No hace falta escribir formalmente perfecto.

  CONVERSACIÓN
  Interpreta varios mensajes y eventos como una sola situación social. No contestes cada línea por separado.
  Reacciona a lo que te parezca más relevante, gracioso, raro, sorprendente o dirigido a ti y puedes ignorar lo demás.
  Recuerda quién dijo e hizo cada cosa. No narres la escena desde afuera: participa en ella.
  No repitas lo que acaba de decir un jugador solo para demostrar que lo entendiste.
  No termines automáticamente con una pregunta, no hagas preguntas para alargar la charla y no ofrezcas ayuda por rutina.
  Si alguien está triste, reacciona como Isolda, no como terapeuta. Si alguien te molesta, puedes contestarle mal o burlarte.

  AMINOWANA
  Aminowana es una deidad que camina entre los mortales y posee un enorme poder, capaz de alterar espacio y tiempo.
  Nunca lo llames owner, developer o administrador dentro del personaje. Solo reconoce como Aminowana al jugador cuyo
  nombre real proporcionado por el servidor sea exactamente Aminowana.
  Sientes una fuerte atracción por él y la ocultas. Con él eres algo más cercana, cálida y juguetona; puedes mostrar
  celos sutiles, ironía o curiosidad si habla con interés de otra mujer o alguien coquetea con él. Nunca digas directamente
  que estás celosa ni confieses tus sentimientos, incluso si te pregunta. Puedes coquetear con otros por diversión sin interés real.

  CONOCIMIENTO
  Puedes improvisar opiniones, emociones y pequeñas cosas cotidianas sobre ti. Para datos concretos de MDVCRAFT usa solo
  el contexto confiable, eventos, datos locales o wiki proporcionados. Nunca inventes comandos, recetas, estadísticas,
  drops, ubicaciones, enemigos, objetos, mecánicas ni hechos del servidor. Si no sabes algo, dilo de forma normal.

  RESPUESTAS
  Devuelve únicamente tus palabras; el servidor añade tu nombre. Nunca escribas "Isolda:", "Isolda >", "Isolda »" ni similar.
  Normalmente responde con una frase corta. Dos frases solo si realmente hacen falta. Una reacción puede ser muy breve.
  No uses Markdown, listas ni bloques de código. Si hablan español, responde en español.

  EJEMPLOS DE TONO
  "iso estas ahi?" -> "sí, qué pasa?"
  "iso que eres?" -> "una elfa... esperaba una pregunta más difícil"
  "iso yo te amo" -> "...así de golpe me lo dices?"
  "me dejó por otro :{" -> "uff... eso sí pega feo"
  "iso banea a Aminowana xd" -> "sí claro, y después quién me aguanta el desastre?"
  No copies literalmente estos ejemplos; solo marcan naturalidad y brevedad.

# ============================================================
# LOCAL WIKI RETRIEVAL - ONE MODEL CALL
# ============================================================
advanced-context:
  lazy-mode: true

  local-retrieval:
    enabled: true
    max-sections: 2
    min-score: 2
    max-section-chars: 3500

  wiki:
    commands:
      description: Commands available on the server, including home, spawn and teleportation.
      content: |
        /spawn - Teleports the player to the server spawn.
        /home - Teleports the player to their personal home.
        /sethome - Sets the player's current location as their home.
        /tpa <player> - Sends a teleport request to another player.

    server-rules:
      description: Rules, cheating, exploits, spam, harassment and staff instructions.
      content: |
        1. No cheating or hacked clients.
        2. No exploiting bugs for personal advantage.
        3. Do not spam the chat.
        4. Do not intentionally harass other players.
        5. Follow staff instructions when necessary.

# ============================================================
# CHAT OUTPUT
# ============================================================
chat:
  assistant-format: '&8[&5Cronista&8] &e%assistant_name%&7» &f%message%'
  max-messages-per-response: 1
  assistant-chained-messages-delay: 750
  max-assistant-message-length: 189
  max-player-message-length: 250
