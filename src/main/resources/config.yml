# ============================================================
# SERVER ASSISTANT 1.6.5 - RUNTIME CONFIG + TOOLS
# ============================================================

# Technical/runtime settings only. Character prompt -> personality.yml; knowledge -> wiki.yml.
# Missing keys from newer plugin versions are merged automatically without replacing your values.
config-version: 5

assistant-name: Isolda

# ============================================================
# AI PROVIDERS
# ============================================================
ai:
  provider: openai
  api-key-env: OPENAI_API_KEY
  api-key: YOUR_OPENAI_API_KEY_HERE
  base-url: https://api.openai.com/v1/
  model: gpt-4o-mini
  max-output-tokens: 75
  temperature: 0.85
  max-requests-per-minute: 12

  # Used only when the primary request fails/is throttled.
  fallback:
    enabled: false
    provider: gemini
    api-key-env: GEMINI_API_KEY
    api-key: YOUR_GEMINI_API_KEY_HERE
    base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.7-flash
    max-output-tokens: 100
    temperature: 0.85
    max-requests-per-minute: 4
    max-wait-ms: 2500

# ============================================================
# ONE GLOBAL PUBLIC CONVERSATION
# ============================================================
global-conversation:
  enabled: true

  # always   = every public message may open a scene (expensive)
  # mention  = only Iso/Isolda opens a scene
  # smart    = mention opens it; only players who directly addressed Isolda
  #            may continue briefly without mentioning her again
  # disabled = only log chat/events; never call AI
  trigger-mode: smart

  mentions:
  - Isolda
  - '@Isolda'
  - Iso
  - '@Iso'

  # Per-player, never global. Context-only participants do not receive this timer.
  smart-follow-up-ms: 16000

  # Optional spontaneous idle request from the friend branch, actually implemented
  # here. Disabled by default because each firing intentionally spends ONE AI call.
  # The timer resets on real player chat and fires at most once until someone chats again.
  idle-scheduling:
    enabled: false
    min-delay-ms: 30000
    max-delay-ms: 120000
    require-online-players: true

  scene:
    # Read relevant context immediately before the trigger, then listen this many
    # milliseconds after it. All collected chat/events are handled as ONE scene.
    capture-window-ms: 2000
    pre-lookback-ms: 8000

    # Applied AFTER Java filters unrelated players/messages.
    max-chat-messages: 10
    max-pre-chat-messages: 5
    max-events: 2
    max-pre-events: 1

    # Lets "Iso viste eso?" see a very recent event even without typing names.
    recent-pre-event-window-ms: 4000

    # No slots and no busy reply. Oldest unsent scene is silently dropped on abuse.
    max-pending-scenes: 3

  # Local RAM logs. They cost zero AI tokens until Java selects relevant context.
  logs:
    max-chat-records: 80
    max-event-records: 30

  # Small compact conversational memory sent to the model.
  history:
    max-scenes: 2
    max-messages-per-scene: 4

  # Events are trusted context only; they NEVER trigger a request by themselves.
  events:
    enabled: true
    player-death: true
    player-advancement: false
    player-join: true
    player-quit: true
    player-kick: true

    # Small event memory selected only when the current question refers to a
    # recent join/quit/death/etc. This fixes questions such as "quien llego?"
    # even when the event happened outside scene.pre-lookback-ms.
    recent-context-limit: 2
    recent-context-max-age-ms: 300000

# ============================================================
# RATE LIMITS
# ============================================================
rate-limits:
  max-scene-triggers-per-player-per-minute: 8
  max-local-queue-delay-ms: 5000

provider-retry:
  # Keep at 0 for strict one-normal-request-per-scene behavior.
  max-503-retries: 0
  initial-503-delay-ms: 1500
  max-503-delay-ms: 5000

# ============================================================
# PROVIDER RESPONSE
# ============================================================
provider-response:
  # OpenAI JSON mode keeps the m/t envelope valid so ACTION calls are not lost
  # when the model would otherwise answer as plain chat text.
  force-json-object-openai: true
  accept-plain-text-fallback: true
  log-fallbacks: false
  debug-malformed-responses: false

# ============================================================
# ASSISTANT TOOLS
# ============================================================
# Merged from the other ServerAssistant branch, adapted to the global one-call
# architecture. CONTEXT tools (wiki/player-data/inventory/profile) run locally BEFORE
# the model request. ACTION tools (sound/lightning/mute/schedule) are explicit
# allow-listed actions returned in the SAME model response.
#
# activation:
#   smart = may run automatically when relevant
#   ask   = ACTION calls require real /sva approve <id> admin approval
#   never = unavailable
#
tools:
  enabled: true
  max-calls-per-response: 2

  # Prevent old/history action requests from being re-executed in later scenes.
  # If GPT emits a stale action anyway, Java blocks it and can suppress the paired
  # misleading chat line instead of letting Isolda claim she did something she did not.
  action-safety:
    require-current-scene-intent: true
    suppress-reply-on-rejected-call: true

  approvals:
    expires-ms: 30000
    max-pending: 8

  local-context:
    max-tools: 2
    max-chars-per-tool: 1800
    # Useful while testing held-item/player-data detection; keep false in production.
    debug-log: false

  # Local trusted Bukkit data; Java adds it only when the scene asks about
  # location/status. No second AI request.
  player-data:
    activation: smart
    max-players: 2
    include-location: true
    include-status: true

  # Optional external profile context (MMOCore + MDVSocial). Details and module
  # toggles live in integrations.yml. It only runs when race/level/title/etc. is relevant.
  profile:
    activation: smart

  # Local trusted inventory/equipment data; Java adds it only when relevant.
  inventory:
    activation: smart
    max-players: 2
    max-items: 18
    # Main-hand details are useful for questions such as "que tengo en la mano?"
    # and include a few lore lines without dumping the full item/NBT.
    include-held-item-details: true
    max-held-lore-lines: 4

  # Fixed allow-listed moderation action. "ask" is enforced by Java, not merely
  # suggested to the model. Admin targets are protected by default.
  mute:
    activation: ask
    duration: 5m
    command: 'mute %player% %duration%'
    allow-admin-targets: false

    # AI mute requests are additionally gated by deterministic Java moderation state.
    # A player cannot become eligible just because somebody says "mutealo" in chat.
    policy:
      enabled: true
      require-eligibility-for-ai: true

      # Only chat currently directed at Isolda (direct mention or active smart follow-up)
      # can register strikes. Ordinary profanity elsewhere in public chat is ignored.
      directed-only: true

      # Built-in multilingual/Spanish profanity coverage is combined with strike-terms.
      # This catches common variants such as chingas/verga/zorra and does not replace
      # your custom list. Small one-character/adjacent-swap typos can also count.
      builtin-lexicon: true
      fuzzy-typos: true

      # Once the threshold is reached Java enforces the policy deterministically:
      # activation=ask -> queues /sva approve; activation=smart -> mutes immediately.
      # The model no longer has to decide whether to request the mute.
      auto-action-on-threshold: true

      strikes-required: 3
      window-ms: 60000
      cooldown-ms: 300000
      debug-log: false

      # Optional custom additions. Built-in terms remain active when enabled above.
      strike-terms:
      - idiota
      - imbecil
      - pelotudo
      - boludo
      - estupido
      - estupida
      - inutil
      - basura
      - callate
      - mierda
      - puta
      - puto
      - forro
      - forra
      - hijo de puta

  # Plays one configured sound to all online players.
  sound:
    activation: smart
    sounds:
      creeper: ENTITY_CREEPER_PRIMED
      explosion: ENTITY_GENERIC_EXPLODE
      anvil: BLOCK_ANVIL_LAND
      level-up: ENTITY_PLAYER_LEVELUP
      villager: ENTITY_VILLAGER_AMBIENT
      enderman: ENTITY_ENDERMAN_SCREAM
      ghast: ENTITY_GHAST_SCREAM
      lightning: ENTITY_LIGHTNING_BOLT_THUNDER
      goat: ENTITY_GOAT_SCREAMING_AMBIENT
      raid-horn: EVENT_RAID_HORN

  # Pure visual/audio lightning; does not damage or ignite blocks.
  lightning:
    activation: smart

  # The friend's branch only described this as TODO. 1.6 actually implements it:
  # Isolda can schedule one already-generated future chat line with zero extra AI calls.
  schedule:
    activation: smart
    min-delay-seconds: 2
    max-delay-seconds: 120
    max-pending: 2

  # Wiki remains local one-call retrieval rather than the friend's tool-call +
  # second-model-request loop.
  wiki:
    activation: smart

# ============================================================
# CHAT OUTPUT
# ============================================================
chat:
  assistant-format: '&8[&5Cronista&8] &e%assistant_name%&7» &f%message%'
  max-messages-per-response: 1
  assistant-chained-messages-delay: 750
  max-assistant-message-length: 189
  max-player-message-length: 250
