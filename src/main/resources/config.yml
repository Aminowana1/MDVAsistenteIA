# ============================================================
# SERVER ASSISTANT 1.4.0
# ============================================================

assistant-name: "ServerAssistant"

# ============================================================
# AI PROVIDER
# ============================================================
# provider: gemini | openai | openai-compatible
# Changing provider/model no longer requires recompiling.
ai:
  provider: "gemini"
  api-key-env: "GEMINI_API_KEY"
  api-key: "YOUR_GEMINI_API_KEY_HERE"
  base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model: "gemini-3.7-flash"

  # Provider-side output cap. This saves tokens before Java truncates chat text.
  max-output-tokens: 128
  temperature: 0.75

# Recent logical messages sent to the model. Lower = cheaper and faster.
message-history-limit: 8

request-triggers:
  player-messages:
    mode: smart
    smart-active-time: 20000
    include-assistant-name-as-mention: true
    mentions:
      - "Server Assistant"
      - "ServerAssistant"
      - "@SVA"
      - "SVA"

  global-events:
    # Keep false while using a very small free quota. Events are optional AI calls.
    enabled: false
    minimum-request-interval-ms: 120000
    max-pending-events: 5
    defer-while-player-conversations-active: true
    events:
      player-death: true
      player-advancement: false
      player-join: false
      player-quit: false
      player-kick: false

  scheduling:
    enabled: false
    min-delay: 60000
    max-delay: 180000

conversation-control:
  max-active-conversations: 2

  group-conversations:
    enabled: true
    max-participants: 6
    join-window-ms: 15000
    join-on-contextual-follow-up: true

    contextual-follow-up-prefixes:
      - "y"
      - "eso"
      - "esa"
      - "ese"
      - "entonces"
      - "pero"

    contextual-follow-up-contains:
      - "tambien"
      - "también"
      - "lo mismo"
      - "sobre eso"
      - "de eso"
      - "lo que dijo"
      - "lo que dice"

    # Explicit hand-off: "Iso responde a Kroattan" can import Kroattan's
    # very recent PUBLIC chat line without feeding all global chat to the AI.
    explicit-handoff:
      enabled: true
      phrases:
        - "responde a"
        - "contesta a"
        - "contestale a"
        - "contéstale a"
        - "lo que dijo"
        - "lo que dice"
        - "pregunta de"
        - "habla con"

  recent-public-chat:
    messages-per-player: 2
    handoff-max-age-ms: 30000

  max-follow-up-messages-without-mention: 4

  human-conversation-detection:
    release-when-user-addresses-other-player: true
    release-when-other-player-addresses-user: true

  max-pending-messages-per-player: 8
  max-messages-per-response: 1
  max-tool-calls-per-response: 2
  max-tool-iterations: 3
  broadcast-tool-progress-messages: false
  recent-server-events-limit: 6

  closing-phrases:
    enabled: true
    phrases:
      - "thanks"
      - "thank you"
      - "bye"
      - "goodbye"
      - "gracias"
      - "muchas gracias"
      - "listo gracias"
      - "perfecto gracias"
      - "dale gracias"
      - "chau"
      - "adios"
      - "nos vemos"

  busy-notice:
    enabled: true
    cooldown-ms: 10000
    message: "&bSVA &7está atendiendo otras conversaciones. Inténtalo de nuevo en unos segundos."

rate-limits:
  max-player-messages-per-minute: 12

  # Gemini Free showed 5 external RPM in the server logs. Use 4 locally to leave margin.
  max-ai-requests-per-minute: 4

  # Multiple fast lines from the same group are accumulated instead of each
  # creating an immediate provider call.
  min-conversation-request-gap-ms: 4000

  # Reject a fresh turn instead of silently holding it for a long time.
  max-local-queue-delay-ms: 5000
  provider-notice-cooldown-ms: 10000

  provider-limit-message: "&bSVA &7necesita unos segundos antes de responder otra vez."
  player-limit-message: "&bSVA &7necesita un momento antes de seguir con tantos mensajes tuyos."

provider-response:
  accept-plain-text-fallback: true
  log-fallbacks: false
  debug-malformed-responses: false

provider-retry:
  # A retry is another paid/quota request. One retry is enough for economical mode.
  max-503-retries: 1
  initial-503-delay-ms: 2500
  max-503-delay-ms: 5000

message-batching:
  wait-time: 1600
  max-wait-time: 3500
  max-size: 6

prompt: |
  You are ServerAssistant, a natural character living inside this Minecraft server.
  Be concise, helpful and human. Never invent server-specific information.

advanced-context:
  lazy-mode: true
  wiki:
    commands:
      description: Commands available on the server.
      content: |
        /spawn - Teleports the player to spawn.
        /home - Teleports the player to their home.
        /sethome - Sets the player's home.
        /tpa <player> - Sends a teleport request.

    server-rules:
      description: Server rules.
      content: |
        1. No cheating or hacked clients.
        2. No bug abuse.
        3. No chat spam.
        4. Do not intentionally harass players.
        5. Follow staff instructions.

chat:
  assistant-format: "&b%assistant_name%&7» &f%message%"
  assistant-chained-messages-delay: 750
  max-assistant-message-length: 220
  max-player-message-length: 220
