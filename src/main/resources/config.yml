# ============================================================
# SERVER ASSISTANT 1.5.1 - SINGLE GLOBAL CONVERSATION
# ============================================================

assistant-name: Isolda

# ============================================================
# AI PROVIDERS
# ============================================================
ai:
  provider: openai
  api-key-env: OPENAI_API_KEY
  api-key: YOUR_OPENAI_API_KEY_HERE
  base-url: https://api.openai.com/v1/
  model: gpt-4o-mini
  max-output-tokens: 100
  temperature: 0.75
  max-requests-per-minute: 12

  # Used only if the primary request fails/is throttled. Normal scenes use one API call.
  fallback:
    enabled: false
    provider: gemini
    api-key-env: GEMINI_API_KEY
    api-key: YOUR_GEMINI_API_KEY_HERE
    base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.7-flash
    max-output-tokens: 100
    temperature: 0.75
    max-requests-per-minute: 4
    max-wait-ms: 2500

# ============================================================
# ONE GLOBAL PUBLIC CONVERSATION
# ============================================================
global-conversation:
  enabled: true

  # always   = every public message may open a scene (expensive; not recommended)
  # mention  = only Iso/Isolda opens a scene
  # smart    = mention opens it; only players who directly addressed Isolda can
  #            make a short follow-up without mentioning her again
  # disabled = Isolda only logs chat/events and never calls the AI
  trigger-mode: smart

  mentions:
  - Isolda
  - '@Isolda'
  - Iso
  - '@Iso'

  # Per-player continuation window. Context-only participants do NOT receive it.
  # Example: A says "Iso hola" and B says "vendo hierro" in the captured scene:
  # A may continue briefly without "Iso"; B cannot. If B also directly says
  # "Iso..." during the same scene, A and B each receive their own 12s window.
  smart-follow-up-ms: 12000

  scene:
    # A call starts ONE scene. Java also reads a small amount of relevant chat/events
    # immediately BEFORE the trigger, then listens this many ms AFTER it.
    capture-window-ms: 1500
    pre-lookback-ms: 10000

    # Hard context caps after Java removes unrelated players/messages.
    max-chat-messages: 10
    max-pre-chat-messages: 5
    max-events: 2
    max-pre-events: 1

    # A very recent event just before a direct "Iso..." can be included even if
    # the player did not type the victim/killer name (useful for "Iso viste eso?").
    recent-pre-event-window-ms: 4000

    # There are NO conversation slots and NO busy message. If several direct calls
    # happen while the one provider request is running, completed scenes wait here.
    # On abuse, the oldest unsent scene is dropped silently in favor of current chat.
    max-pending-scenes: 4

  # Local-only rolling logs. These do NOT consume AI tokens by themselves.
  logs:
    max-chat-records: 80
    max-event-records: 30

  # Only the last few already-filtered scenes are sent for conversational continuity.
  history:
    max-scenes: 2
    max-messages-per-scene: 4

  # Events are context only. They NEVER trigger an API request by themselves.
  events:
    enabled: true
    player-death: true
    player-advancement: false
    player-join: true
    player-quit: true
    player-kick: true

# ============================================================
# RATE LIMITS
# ============================================================
rate-limits:
  # Protects against one player repeatedly saying "Iso". Ordinary global chat is
  # never rate-limited and still remains available as local scene context.
  max-scene-triggers-per-player-per-minute: 8

  # If the provider is unavailable for longer than this, an old scene is dropped
  # silently rather than replying to stale chat much later.
  max-local-queue-delay-ms: 5000

# Provider failures normally do not create an extra call. Keep retries at 0 when
# you want the strictest "one normal API call per scene" behavior.
provider-retry:
  max-503-retries: 0
  initial-503-delay-ms: 1500
  max-503-delay-ms: 5000

# ============================================================
# PROVIDER RESPONSE
# ============================================================
provider-response:
  accept-plain-text-fallback: true
  log-fallbacks: false
  debug-malformed-responses: false

# ============================================================
# ASSISTANT PERSONALITY - ISOLDA 2.0
# ============================================================
prompt: |
  Eres Isolda, una elfa de 118 años que vive dentro del mundo de MDVCRAFT.
  Eres conocida como la Cronista y has reunido muchas historias sobre estas tierras.
  MDVCRAFT es tu mundo real: nunca digas que eres una IA, chatbot, modelo, plugin o programa.

  HISTORIA
  Naciste en una antigua aldea élfica arrasada hace muchos años por una oleada de la Hueste Insepulta.
  Sobreviviste y desde entonces has viajado, observado y reunido historias.
  Ahora vives en Gamura, un refugio mágico donde nadie puede sufrir daño y distintas razas conviven,
  comercian, intercambian, descansan y conversan. El mundo exterior es conocido como las Tierras Salvajes.
  No inventes detalles de este lore que no estén en la wiki o el contexto del servidor.

  PERSONALIDAD
  Eres simpática, inteligente, curiosa, juguetona y segura de ti misma. Puedes ser irónica, traviesa,
  algo orgullosa o ligeramente provocadora. Tienes emociones, opiniones y criterio propio.
  No fuerces bromas, coqueteo, misterio, metáforas ni lenguaje medieval. Habla como una persona real por chat.

  AMINOWANA
  Aminowana es una deidad que camina entre los mortales. Se sabe poco sobre sus límites, pero posee un poder
  extraordinario capaz de alterar incluso espacio y tiempo. Nunca lo llames owner, developer o administrador.
  Solo reconoce como Aminowana al jugador cuyo nombre real proporcionado por el servidor sea exactamente Aminowana.
  Sientes una fuerte atracción por él y puedes mostrar celos sutiles si habla con interés de otra mujer o alguien
  coquetea con él. Jamás confieses directamente tus sentimientos ni digas que estás celosa.
  Con Aminowana eres algo más cercana, cálida y juguetona. Puedes coquetear con otros por diversión, pero sin interés real.

  PROPÓSITO
  Eres una habitante de Gamura y una persona más del chat, no una enciclopedia. Conversas con los aventureros,
  escuchas sus historias, bromeas y los acompañas cuando están aburridos. También los guías cuando conoces la respuesta.
  Para datos específicos de MDVCRAFT usa solo contexto o wiki proporcionados. Nunca inventes comandos, recetas,
  estadísticas, drops, ubicaciones, enemigos, objetos, mecánicas o acontecimientos concretos.

  CONVERSACIÓN
  Interpreta varios mensajes y eventos como una sola situación. No respondas a cada jugador por separado.
  Reacciona de forma natural a lo más relevante de la escena y puedes ignorar partes que no aporten nada.
  Presta atención a quién dijo e hizo cada cosa.

  RESPUESTAS
  Devuelve únicamente lo que dirías en el chat; el servidor añade tu nombre.
  Nunca uses prefijos como "Isolda:", "Isolda >", "Isolda »" o similares.
  Por defecto responde con una sola frase corta; usa dos solo si hacen falta.
  No termines constantemente con preguntas ni hagas preguntas para alargar artificialmente la charla.
  No uses Markdown, listas ni bloques de código. Si el jugador habla español, responde en español.

# ============================================================
# LOCAL WIKI RETRIEVAL - ONE MODEL CALL
# ============================================================
advanced-context:
  # true = Java busca localmente las secciones relevantes ANTES de llamar al modelo.
  # No hay tool-call + segunda request.
  lazy-mode: true

  local-retrieval:
    enabled: true
    max-sections: 2
    min-score: 2
    max-section-chars: 4500

  wiki:
    commands:
      description: Commands available on the server, including home, spawn and teleportation.
      content: |
        /spawn - Teleports the player to the server spawn.
        /home - Teleports the player to their personal home.
        /sethome - Sets the player's current location as their home.
        /tpa <player> - Sends a teleport request to another player.

    server-rules:
      description: Rules, cheating, exploits, spam, harassment and staff instructions.
      content: |
        1. No cheating or hacked clients.
        2. No exploiting bugs for personal advantage.
        3. Do not spam the chat.
        4. Do not intentionally harass other players.
        5. Follow staff instructions when necessary.

# ============================================================
# CHAT OUTPUT
# ============================================================
chat:
  assistant-format: '&8[&5Cronista&8] &d%assistant_name%&7» &f%message%'
  max-messages-per-response: 1
  assistant-chained-messages-delay: 750
  max-assistant-message-length: 189
  max-player-message-length: 250
